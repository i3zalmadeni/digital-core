<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول – النواة الرقمية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"></head><body class="pubsite lgbody">
<div id="hdr"></div>
<div class="login card lgc"><div class="lgi" data-core></div><h2>تسجيل الدخول</h2><p class="sub">النواة الرقمية · متوسطة لبيد بن ربيعة</p>
<p class="sub" id="to" hidden></p>
<form id="f"><label for="e">معرّف الدخول</label><input id="e" type="text" required autocomplete="username" dir="ltr" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text" placeholder="أرقام أو حروف إنجليزية">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password">
<label class="lgchk" for="rm"><input id="rm" type="checkbox"><span>حفظ معلوماتي<small class="sub">يحفظ معرّف الدخول على هذا الجهاز فقط، ولا تُحفظ كلمة المرور.</small></span></label>
<p class="err" id="m" role="alert"></p><button class="btn" id="go">دخول</button></form>
<div id="fw" hidden><div class="lgor" id="lor"><span>أو</span></div><button class="btn lgface" id="fb" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v4h-1M9 16c1.5 1.3 4.5 1.3 6 0"/></svg>الدخول ببصمة الوجه</button><small class="sub" style="display:block;text-align:center;margin-top:6px">يتحقق جهازك من وجهك أو بصمتك، ولا تصل النواة أي صورة.</small><button class="btn ghost lgskip" id="upw" type="button" hidden>الدخول بكلمة المرور</button></div>
<div id="offer" hidden><h3 style="text-align:center;margin:6px 0">تفعيل الدخول ببصمة الوجه؟</h3><p class="sub">ادخل لاحقاً بلمسة واحدة على هذا الجهاز دون كتابة كلمة المرور. تتحقق بصمة جهازك من الوجه، ولا تُحفظ صورة وجهك لدينا.</p><p class="err" id="om" role="alert"></p><button class="btn" id="oy" type="button"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M9 10v1M15 10v1M12 10v4h-1M9 16c1.5 1.3 4.5 1.3 6 0"/></svg>تفعيل الآن</button><button class="btn ghost lgskip" id="on" type="button">ليس الآن</button></div></div><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/chrome.js"></script><script src="assets/unified-kit.js"></script><script src="assets/config.js"></script><script src="assets/passkey.js"></script><script>
pubInit("login.html");
// صفحة الدخول الموحدة للبوابات الرقمية: حساب واحد عبر النواة لكل البوابات.
// الأنظمة الثلاثة على الأصل نفسه (i3zalmadeni.github.io) وتستعمل قاعدة النواة نفسها، فتُشارَك الجلسة بينها تلقائياً.
// next: النظام الذي طلب الدخول. لا يُقبل إلا أحد مسارات الأنظمة المعروفة (منعاً لإعادة التوجيه إلى مواقع أخرى).
const SYSTEMS = [{ p: "/digital-core/", n: "النواة الرقمية" }, { p: "/self-evaluation/", n: "التقويم المدرسي الذكي" }, { p: "/teachers-community/", n: "المجتمع المهني الذكي" }, { p: "/facility-booking/", n: "احجز مرفق" }, { p: "/qiyami/", n: "قيمي" }, { p: "/indibati/", n: "انضباطي" }, { p: "/report/", n: "مرآة | الملف الشامل" }];
const safeNext = (raw) => {
  if (!raw) return null;
  try {
    const u = new URL(raw, location.href);
    if (u.origin !== location.origin) return null;
    const s = SYSTEMS.find((x) => (u.pathname.toLowerCase() + (u.pathname.endsWith("/") ? "" : "/")).startsWith(x.p));
    return s ? { href: u.href, name: s.n } : null;
  } catch (_) { return null; }
};
const qs = new URLSearchParams(location.search);
const nxt = safeNext(qs.get("next"));
const after = () => location.replace(nxt ? nxt.href : "dashboard.html");
if (nxt && nxt.name !== "النواة الرقمية") { const t = document.getElementById("to"); t.textContent = "للدخول إلى " + nxt.name; t.hidden = false; }
const MSG = {
  nostaff: "هذا الحساب غير مرتبط بسجل منسوب. راجع مدير النواة.",
  inactive: "حسابك غير مفعّل في النواة الرقمية. راجع مدير النواة.",
  denied: "حسابك معروف في النواة الرقمية لكنه غير مرتبط بهذا النظام. راجع مدير النواة أو منسق النظام.",
  load: "تعذّر تحميل بيانات حسابك. حاول مرة أخرى.",
};
const em = qs.get("e") || (location.search.includes("nostaff") ? "nostaff" : "");
if (MSG[em]) document.getElementById("m").textContent = MSG[em];
// المعرّف (رقم أو حروف) يُترجم إلى بريد داخلي؛ ومن أدخل بريداً حقيقياً (الحسابات القديمة) يُستعمل كما هو.
const toAuthEmail = (v) => { v = v.trim().toLowerCase(); return v.includes("@") ? v : v + "@" + (window.LOGIN_DOMAIN || "id.invalid"); };
const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey);
// جلسة قائمة: نتابع إلى الوجهة، إلا إن عاد النظام برسالة خطأ (فيكون قد أنهى الجلسة بنفسه).
if (!MSG[em]) sb.auth.getSession().then(({ data }) => { if (data.session) after(); });
// حفظ معلوماتي: معرّف الدخول فقط (لا كلمة مرور) على هذا الجهاز.
const $ = (i) => document.getElementById(i), RK = "dc_login_id";
try { const sv = localStorage.getItem(RK); if (sv) { $("e").value = sv; $("rm").checked = true; $("p").focus(); } } catch (_) {}
const remember = () => { try { if ($("rm").checked) localStorage.setItem(RK, $("e").value.trim().toLowerCase()); else localStorage.removeItem(RK); } catch (_) {} };
$("rm").onchange = remember;
// الدخول ببصمة الوجه
PK.available().then((ok) => {
  if (!ok) return;
  $("fw").hidden = false;
  // جهاز مفعّل: بصمة الوجه هي الافتراضية، وكلمة المرور خيار ثانوي
  if (PK.enrolledHere() && PK.hasCred() && !MSG[em]) {
    $("f").hidden = true; $("lor").hidden = true; $("upw").hidden = false;
    $("upw").onclick = () => { $("f").hidden = false; $("upw").hidden = true; $("lor").hidden = false; $("p").focus(); };
    $("fb").click();
  }
});
$("fb").onclick = async () => {
  const m = $("m"), b = $("fb"); if (b.disabled) return; m.textContent = ""; b.disabled = true;
  try { await PK.login(sb); after(); } catch (e) { m.textContent = e.message; b.disabled = false; if (!PK.hasCred() && $("f").hidden) { $("f").hidden = false; $("upw").hidden = true; $("lor").hidden = false; } }
};
// عرض تفعيل البصمة بعد أول دخول بكلمة المرور على جهاز يدعمها
async function offerOrGo() {
  if (!(await PK.available()) || PK.enrolledHere() || PK.declined()) { after(); return; }
  $("f").hidden = true; $("fw").hidden = true; $("offer").hidden = false;
  $("on").onclick = () => { PK.decline(); after(); };
  $("oy").onclick = async () => {
    const b = $("oy"); b.disabled = true; $("om").textContent = "";
    try { await PK.register(sb, PK.deviceLabel()); after(); } catch (e) { $("om").textContent = e.message; b.disabled = false; }
  };
}
document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault();
  const m = document.getElementById("m"), go = document.getElementById("go"); if (go.disabled) return;
  m.textContent = ""; go.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: toAuthEmail(document.getElementById("e").value), password: document.getElementById("p").value });
  if (!error) { remember(); offerOrGo(); return; }
  go.disabled = false;
  m.textContent = /banned/.test(error.code || "") ? "هذا الحساب موقوف. راجع مدير النواة."
    : (error.code === "invalid_credentials" || error.status === 400) ? "بيانات الدخول غير صحيحة." : "تعذر الاتصال بالخادم، حاول مرة أخرى."; };
</script></body></html>
